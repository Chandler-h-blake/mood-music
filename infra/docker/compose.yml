name: moodmusic

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: moodmusic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moodmusic
      POSTGRES_USER: moodmusic
      POSTGRES_PASSWORD: moodmusic
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - moodmusic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodmusic -d moodmusic"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  moodmusic-postgres-data:
