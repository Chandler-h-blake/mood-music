version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    # Routine upgrades are reviewed manually; security alerts remain enabled.
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: monthly
    # Routine upgrades are reviewed manually; security alerts remain enabled.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
